<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil Personal - Crhistopher Capcha</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #222;
        }

        .descripcion {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .datos {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        .dato {
            background: #f5f6fa;
            padding: 18px 20px;
            border-radius: 12px;
            border-left: 5px solid #667eea;
        }

        .dato strong {
            display: block;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .dato span {
            font-size: 18px;
            color: #333;
        }

        footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #888;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 26px;
            }

            .avatar {
                width: 100px;
                height: 100px;
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="avatar">
            CC
        </div>

        <h1>Crhistopher Capcha</h1>

        <p class="descripcion">
            Estudiante de desarrollo de software
        </p>

        <section class="datos">

            <div class="dato">
                <strong>Nombre</strong>
                <span>Crhistopher Capcha</span>
            </div>

            <div class="dato">
                <strong>Instituto</strong>
                <span>Idat</span>
            </div>

            <div class="dato">
                <strong>Curso</strong>
                <span>Desarrollo de Servicios Web</span>
            </div>

        </section>

        <footer>
            &copy; 2026 Crhistopher Capcha
        </footer>

    </main>

</body>
</html>
